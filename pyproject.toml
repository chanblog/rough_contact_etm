[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rough-contact-etm"
version = "0.1.0"
description = "Thermo-electro-mechanical rough contact simulation workflow using Tamaas and FFT kernels."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "MC L" }
]
keywords = ["contact mechanics", "rough surfaces", "electrical contact", "thermal contact", "Tamaas"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
  "numpy",
  "matplotlib",
  "h5py"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
